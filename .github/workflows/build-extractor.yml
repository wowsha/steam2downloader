name: Build native Steam2 tool

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GUI dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxft-dev libxinerama-dev libxcursor-dev libxfixes-dev libxrender-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Smoke test CLI
        run: ./build/steam2tool --help
      - name: Verify CLI and GUI
        run: |
          test -x build/steam2tool
          test -x build/steam2tool-gui
      - name: Package Linux
        run: tar -C build -czf steam2tool-linux-x64.tar.gz steam2tool steam2tool-gui
      - name: Publish nightly Linux release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view steam2tool-nightly >/dev/null 2>&1 || gh release create steam2tool-nightly --title 'Steam2 Tool Nightly' --notes 'Automated native builds from main.' --prerelease --target "$GITHUB_SHA"
          gh release upload steam2tool-nightly steam2tool-linux-x64.tar.gz --clobber

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Smoke test CLI
        shell: pwsh
        run: .\build\Release\steam2tool.exe --help
      - name: Verify CLI and GUI
        shell: pwsh
        run: |
          if (-not (Test-Path .\build\Release\steam2tool.exe)) { throw 'steam2tool.exe was not produced' }
          if (-not (Test-Path .\build\Release\steam2tool-gui.exe)) { throw 'steam2tool-gui.exe was not produced' }
      - name: Package Windows
        shell: pwsh
        run: Compress-Archive -Path .\build\Release\steam2tool.exe, .\build\Release\steam2tool-gui.exe -DestinationPath .\steam2tool-windows-x64.zip
      - name: Publish nightly Windows release asset
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view steam2tool-nightly *> $null
          if ($LASTEXITCODE -ne 0) { gh release create steam2tool-nightly --title 'Steam2 Tool Nightly' --notes 'Automated native builds from main.' --prerelease --target $env:GITHUB_SHA }
          gh release upload steam2tool-nightly .\steam2tool-windows-x64.zip --clobber
