name: Build native Steam2 tool

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Smoke test
        run: ./build/steam2tool --help
      - name: Verify binary
        run: test -x build/steam2tool
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: steam2tool-linux-x64
          path: build/steam2tool

  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Smoke test
        shell: pwsh
        run: .\build\Release\steam2tool.exe --help
      - name: Verify binary
        shell: pwsh
        run: if (-not (Test-Path .\build\Release\steam2tool.exe)) { throw 'steam2tool.exe was not produced' }
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: steam2tool-windows-x64
          path: build/Release/steam2tool.exe
